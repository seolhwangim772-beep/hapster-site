<!--
  ════════════════════════════════════════════════════════════════════════════
  hapster.kr/ios — ★짧은 설치 주소 (2026-11-06 대표 지시)
  ════════════════════════════════════════════════════════════════════════════
  구조는 ../android/index.html 과 ★같다(세 겹: meta refresh · 자바스크립트 · 보이는 링크).
  ★왜 세 겹인지는 그 파일 주석에 적어 뒀다.

  ★★★2026-11-07 ★애플 승인 — ★TestFlight 를 걷어내고 ★앱스토어로 바꿨다.
     목적지 = https://apps.apple.com/kr/app/id6827808995
     ★앱ID `6827808995` 은 ★추측이 아니다 — bundleId `com.tbic.hapster` 로
       `itunes.apple.com/lookup?bundleId=…&country=kr` 를 때려 받은 ★trackId 다
       (trackName=HAPSTER · sellerName=TBIC Co.,Ltd · version 1.1 까지 대조했다).
     ★이 파일 안에 주소가 ★세 번 나온다(전부 같은 글자 · 찾아 바꾸기 한 번).
       셋이 어긋나면 아래 스크립트가 ★콘솔에 경고를 찍는다:
       ⓐ <meta http-equiv="refresh"> 의 url=   ⓑ <a id="go"> 의 href=   ⓒ 스크립트의 var DEST

  ★★승인일에 ★같이 끝낸 일 — 옛 체크목록 ⓓ~ⓖ 다. ★결과를 적어 둔다:
     ⓓ ✅ ../index.html 의 아이폰 버튼 ★2곳 — ★앱스토어 공식 배지로 교체(글자 버튼이 사라졌다)
     ⓔ ✅ ../index.html 의 GA 판정 — `testflight` → ★`apps.apple.com` (★같은 커밋에서 고쳤다)
          ⚠️ 이걸 안 고치면 ★download_ios 가 ★조용히 0건이 된다 — 주소를 바꾼 그 순간부터다
     ⓕ ✅ 두 배지 ★크기를 같게 — `--vis` ★한 선언을 `.cta` 에 두고 둘이 ★나눠 쓴다
          ★애플 최소 높이가 40px 이라 바닥을 30 → ★40px 로 올렸다(구글 최소 28 보다 위다)
          ★애플 규칙대로 ★앱스토어 배지를 ★먼저 뒀다("Place the App Store badge first
            in the lineup of badges." — 원문은 ../index.html 의 배지 CSS 주석에)
     ⓖ ⏳ ★공개 게시물 링크 — ★대표 확인 대기. 바로 아래 단락이 그 얘기다

  ★★어디에 무엇을 뿌리나 — ★승인으로 ★사정이 바뀐 자리다
     11-06 결정: 공개 게시물(유튜브 설명·고정댓글·인스타 캡션)에는 ★플레이스토어 ★직링크.
       왜: 모르는 사람에게 `hapster.kr` 은 ★낯선 주소라 ★눌리기 전에 의심받는다.
     11-06 에 ★같이 정해 둔 것: "애플 승인이 나면 공개 자리를 ★다시 `hapster.kr` 로 돌린다"
       왜: 승인 뒤에는 ★아이폰 사용자도 오므로 ★한 주소가 둘 다 받아야 한다.
     ⚠️⚠️ ★그 조건이 ★오늘 충족됐다(2026-11-07). 그런데 ★"낯선 주소라 의심받는다" 는 이유는
       ★그대로 남아 있다 — ★두 이유가 부딪힌다. ★대표가 고를 몫이라 ★내가 안 바꿨다.
       ⇒ ★지금 상태 = 공개 자리는 ★플레이스토어 직링크(11-06 그대로) · ★대표 확정 대기.
       ⇒ `hapster.kr` 로 돌리기로 하면 ★고칠 코드는 ★없다 — ★이 단락만 고친다.
     ★짧은 주소(이 페이지)를 쓰는 자리는 ★그대로다 — ★글자로 적거나 불러줘야 하는 곳:
        틱톡 소개글(링크 칸이 없다) · 명함 · 오프라인 QR · 입으로 불러줄 때 · 크루장 DM
  ⚠️ ★TestFlight 는 ★끝났다 — 이제 ★누구나 앱스토어에서 깐다(외부 테스터 자리 수 제한이 사라졌다).
     ⇒ ★"승인 전에는 가까운 사람에게만" 이던 제한은 ★없어졌다. 이 주소는 넓게 뿌려도 된다.
  ════════════════════════════════════════════════════════════════════════════
-->

<style>
  html,body{margin:0;height:100%;background:#0A0B0C;color:#F1F3F4;
    font-family:"Noto Sans KR",system-ui,-apple-system,sans-serif;color-scheme:dark}
  .box{min-height:100%;display:flex;flex-direction:column;align-items:center;

  .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#CCFF00;
       margin:0 2px;animation:b 1s infinite ease-in-out}

<script async src="https://www.googletagmanager.com/gtag/js?id=G-BXJRZP0E0L"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-BXJRZP0E0L');

<div class="box">
  <div class="bi">HAPSTER</div>
  <div class="msg">App Store로 이동 중<span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
  <div class="sub">잠시 기다려 주세요. 안 넘어가면 아래를 눌러 주세요.</div>
  <!-- ⚠️ "App Store" 는 ★번역하지 않는다 — 애플 가이드라인이 금지한다(배지 alt 와 같은 이유). -->
  <a class="go" id="go" href="https://apps.apple.com/kr/app/id6827808995">아이폰 설치</a>
</div>

<script>
(function(){
  /* ★★목적지 (ⓒ) — 위 meta refresh(ⓐ) · 보이는 링크(ⓑ)와 ★같은 글자여야 한다.
     ★2026-11-07 애플 승인으로 ★TestFlight 에서 바뀐 값이다(앱ID 는 itunes lookup 으로 확인). */
  var DEST = 'https://apps.apple.com/kr/app/id6827808995';
  var PLATFORM = 'ios';

  /* ★셋이 어긋났나 ★스스로 본다 — 사람이 기억으로 지키는 규칙은 샌다 */
  (function selfCheck(){
    var m = document.querySelector('meta[http-equiv="refresh"]');
    var metaUrl = m ? (m.getAttribute('content')||'').replace(/^[^;]*;\s*url=/i,'') : '';
    var aUrl = (document.getElementById('go')||{}).href || '';
    if (metaUrl !== DEST || aUrl !== DEST) {
      console.warn('[shortlink] ★목적지가 서로 다르다 — 셋을 같이 고쳐라',
        {meta: metaUrl, link: aUrl, script: DEST});
    }
  })();

  var q = new URLSearchParams(location.search);
  var raw = q.get('s') || q.get('utm_source') || '';
  var src = /^[A-Za-z0-9_-]{1,32}$/.test(raw) ? raw : '';

  /* ⚠️ 안드로이드와 ★다른 점 — 주소에 ★꼬리표를 안 붙인다. ★앱스토어로 바뀐 뒤에도 같다.
     ★애플은 구글의 `referrer` 처럼 ★출처를 설치까지 이어주는 값을 ★안 받는다.
     ⚠️ `?ct=`·`?pt=` 는 ★캠페인 링크(App Analytics)용인데 ★제휴/캠페인 토큰이 있어야 한다 —
        ★없이 붙이면 주소만 지저분해지고 집계는 ★안 생긴다. ★붙이지 말 것(대표 지시 2026-11-07).
     ⇒ 출처는 ★GA 쪽으로만 남긴다(아래 shortlink_ios 의 source). */
  var url = DEST;

  var gone = false;
  function go(){ if (gone) return; gone = true; location.replace(url); }

  /* ★`source`·`from` 이 GA 보고서 화면에 안 뜨는 이유(맞춤 측정기준을 ★일부러 등록 안 했다)는
     ../android/index.html 의 ★같은 자리 주석에 적어 뒀다. 여기 다시 안 적는다. */
  try {
    gtag('event', 'shortlink_' + PLATFORM, {
      source: src || '(none)',
      from: document.referrer || '(direct)',
      event_callback: go
    });
  } catch (e) {}

  setTimeout(go, 700);
})();
</script>
