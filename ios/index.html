<meta name="robots" content="noindex,follow">
<!--
  ════════════════════════════════════════════════════════════════════════════
  hapster.kr/ios — ★짧은 설치 주소 (2026-11-06 대표 지시)
  ════════════════════════════════════════════════════════════════════════════
  구조는 ../android/index.html 과 ★같다(세 겹: meta refresh · 자바스크립트 · 보이는 링크).
  ★왜 세 겹인지는 그 파일 주석에 적어 뒀다.

  ★★★애플 승인이 나면 ★여기를 바꾼다 — ★이 파일 안에 주소가 ★세 번 나온다(전부 같은 글자 ·
     찾아 바꾸기 한 번). 셋이 어긋나면 아래 스크립트가 ★콘솔에 경고를 찍는다:
     ⓐ <meta http-equiv="refresh"> 의 url=   ⓑ <a id="go"> 의 href=   ⓒ 스크립트의 var DEST
   ★그리고 ★첫 화면·운용도 같이 (ⓒ 가 두 번 쓰여 있던 것을 2026-11-06 에 바로잡았다):
     ⓓ ../index.html 의 아이폰 버튼(b2) ★2곳 — 글자도 "TestFlight로 받기" 가 거짓이 된다
     ⓔ ../index.html 의 GA 판정 — 지금 `href.indexOf('testflight')` 로 가른다.
        앱스토어 주소로 바꾸면 ★그 줄도 같이 고쳐야 download_ios 가 안 끊긴다
     ⓕ 아이폰 버튼을 ★앱스토어 배지로 바꿀 때는 ★구글 플레이 배지와 ★크기를 같게 할 것
        (구글 규칙: 다른 스토어 배지와 같거나 더 크게 — 자세한 건 ../index.html 의 .b1 주석)
     ⓖ ★공개 게시물의 링크를 ★다시 `hapster.kr` 로 되돌린다 (대표 확정 2026-11-06)
        — 승인 뒤에는 ★아이폰 사용자도 오므로 ★한 주소가 둘 다 받아야 한다.
          지금은 아래 사정 때문에 ★플레이스토어 직링크를 쓰고 있다.
  ★새 주소 꼴: https://apps.apple.com/kr/app/id<앱ID>
     ⚠️ 앱ID 는 ★승인 뒤 App Store Connect 에서 확인한다. ★지금은 모른다 — 추측해 넣지 말 것.
  ⚠️ 지금은 ★TestFlight 라 ★아무나 못 깐다(외부 테스터 자리 수 제한). 그래서 이 주소를
     넓게 뿌리면 "안 깔린다" 문의가 온다 — ★승인 전에는 가까운 사람에게만 줄 것.
     ★★공개 게시물(유튜브 설명·고정댓글·인스타 캡션)에는 ★플레이스토어 ★직링크를 쓴다.
       ★`hapster.kr` 이 ★아니다 (대표 확정 2026-11-06 — 같은 날 ★바뀐 결정이다).
       왜: 모르는 사람에게 `hapster.kr` 은 ★낯선 주소라 ★눌리기 전에 의심받는다.
           `play.google.com` 으로 시작해야 신뢰가 간다.
       ⇒ 그래서 ★공개 자리에는 ★아이폰 링크가 아예 안 나간다(안드로이드 직링크 하나뿐).
     ⇒ 애플 승인이 나면 이 제한이 풀린다. 그때 위 ⓐ~ⓖ 를 한 번에 정리한다(대표 확정).
  ════════════════════════════════════════════════════════════════════════════
-->
<meta http-equiv="refresh" content="2;url=https://testflight.apple.com/join/DtBcKVKC">
<style>
  html,body{margin:0;height:100%;background:#0A0B0C;color:#F1F3F4;
    font-family:"Noto Sans KR",system-ui,-apple-system,sans-serif;color-scheme:dark}
  .box{min-height:100%;display:flex;flex-direction:column;align-items:center;
       justify-content:center;gap:14px;padding:24px;text-align:center}
  .bi{font:900 13px/1 system-ui;letter-spacing:.22em;color:#CCFF00}
  .msg{font-size:15px;font-weight:700}
  .sub{font-size:13px;color:#8C949C}
  a.go{margin-top:4px;display:inline-block;padding:13px 22px;border-radius:10px;
       background:#CCFF00;color:#0A0B0C;font-weight:900;font-size:15px;text-decoration:none}
  .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#CCFF00;
       margin:0 2px;animation:b 1s infinite ease-in-out}
  .dot:nth-child(2){animation-delay:.15s} .dot:nth-child(3){animation-delay:.3s}
  @keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}
  @media (prefers-reduced-motion:reduce){.dot{animation:none;opacity:.7}}
</style>

<script async src="https://www.googletagmanager.com/gtag/js?id=G-BXJRZP0E0L"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-BXJRZP0E0L');
</script>

<div class="box">
  <div class="bi">HAPSTER</div>
  <div class="msg">TestFlight로 이동 중<span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
  <div class="sub">잠시 기다려 주세요. 안 넘어가면 아래를 눌러 주세요.</div>
  <a class="go" id="go" href="https://testflight.apple.com/join/DtBcKVKC">아이폰 설치</a>
</div>

<script>
(function(){
  /* ★★목적지 (ⓒ) — 위 meta refresh(ⓐ) · 보이는 링크(ⓑ)와 ★같은 글자여야 한다.
     ★애플 승인 뒤: 'https://apps.apple.com/kr/app/id<앱ID>' */
  var DEST = 'https://testflight.apple.com/join/DtBcKVKC';
  var PLATFORM = 'ios';

  /* ★셋이 어긋났나 ★스스로 본다 — 사람이 기억으로 지키는 규칙은 샌다 */
  (function selfCheck(){
    var m = document.querySelector('meta[http-equiv="refresh"]');
    var metaUrl = m ? (m.getAttribute('content')||'').replace(/^[^;]*;\s*url=/i,'') : '';
    var aUrl = (document.getElementById('go')||{}).href || '';
    if (metaUrl !== DEST || aUrl !== DEST) {
      console.warn('[shortlink] ★목적지가 서로 다르다 — 셋을 같이 고쳐라',
        {meta: metaUrl, link: aUrl, script: DEST});
    }
  })();

  var q = new URLSearchParams(location.search);
  var raw = q.get('s') || q.get('utm_source') || '';
  var src = /^[A-Za-z0-9_-]{1,32}$/.test(raw) ? raw : '';

  /* ⚠️ 안드로이드와 ★다른 점 — 주소에 ★꼬리표를 안 붙인다.
     TestFlight 가입 링크는 `referrer` 같은 값을 ★안 받는다(붙이면 지저분하기만 하다).
     출처는 ★GA 쪽으로만 남긴다. 앱스토어로 바꾼 뒤에도 같다(애플은 pt·ct 를 쓰는데
     그건 ★제휴 토큰이 있어야 한다 — 없으면 넣지 말 것). */
  var url = DEST;

  var gone = false;
  function go(){ if (gone) return; gone = true; location.replace(url); }

  /* ★`source`·`from` 이 GA 보고서 화면에 안 뜨는 이유(맞춤 측정기준을 ★일부러 등록 안 했다)는
     ../android/index.html 의 ★같은 자리 주석에 적어 뒀다. 여기 다시 안 적는다. */
  try {
    gtag('event', 'shortlink_' + PLATFORM, {
      source: src || '(none)',
      from: document.referrer || '(direct)',
      event_callback: go
    });
  } catch (e) {}

  setTimeout(go, 700);
})();
</script>
